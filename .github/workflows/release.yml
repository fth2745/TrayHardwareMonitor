name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore TrayHardwareMonitor.csproj

      - name: Publish Win-x64 Release
        run: |
          dotnet publish TrayHardwareMonitor.csproj -c Release -r win-x64 --self-contained false -o ./publish_release

      - name: Create Zip Archive
        run: |
          Compress-Archive -Path ./publish_release/* -DestinationPath ./TrayHardwareMonitor-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./TrayHardwareMonitor-win-x64.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
