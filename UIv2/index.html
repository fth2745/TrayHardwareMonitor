<!DOCTYPE html>
<html lang="tr" data-theme="T-bento">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tray Hardware Monitor — UI v2 Modüler Telemetri</title>
  <link rel="stylesheet" href="/v2/styles/tokens.css" />
  <link rel="stylesheet" href="/v2/styles/layout.css" />
  <link rel="stylesheet" href="/v2/styles/components.css" />
</head>
<body>
  <div class="uiv2-shell">
    <!-- Üst Başlık & Kontrol Çubuğu (Sade Tek Sayfa Kabuk) -->
    <header class="uiv2-topbar">
      <div class="topbar-brand">
        <div class="brand-titles">
          <h1>
            <span id="appMainTitle" class="shimmer-title">TrayHardwareMonitor</span>
            <span id="liveStatusDot" class="live-dot" title="Canlı Veri Akışı"></span>
          </h1>
        </div>
      </div>

      <div class="topbar-controls">
        <!-- Düzen Seçici (2 Sütun / 3 Sütun) -->
        <select id="layoutSelect" class="ctrl-select" title="Izgara Düzeni">
          <option value="cols-2" selected>2 Sütun (İkili)</option>
          <option value="cols-3">3 Sütun (Üçlü)</option>
        </select>

        <!-- Tema Seçici (Karanlık, Gece Mavisi, Saf Siyah, Aydınlık, Mor Gece) -->
        <select id="themeSelect" class="ctrl-select" title="Tema Seçimi">
          <option value="T-bento">Karanlık</option>
          <option value="T-neon">Gece Mavisi</option>
          <option value="T-minimal">Saf Siyah</option>
          <option value="T-light">Aydınlık</option>
          <option value="T-violet">Mor Gece</option>
        </select>

        <!-- Kart Yönetimi Butonu -->
        <button id="btnOpenDrawer" class="ctrl-btn primary" type="button">
          <span>Kartları Yönet</span>
        </button>

        <!-- Yatay Dijital Saat & Uptime Masa Modu Widget'ı -->
        <div class="desk-clock-widget tabular-nums" id="deskClockWidget" title="Sistem Saati ve Açık Kalma Süresi">
          <div class="desk-clock-body">
            <div class="desk-clock-time" id="topbarClockTime">--:--:--</div>
            <div class="desk-clock-sub">
              <span class="desk-uptime-dot"></span>
              <span class="desk-uptime-label">AÇIK:</span>
              <span class="desk-uptime-val" id="topbarUptimeVal">--</span>
            </div>
          </div>
          <button id="btnToggleDeskMode" class="desk-mode-btn" type="button" title="Masa Modu (Zen / Odaklanmış Ekran)">
            <span class="desk-mode-icon">⛶</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Ana Bento / 2x2 Kart Izgarası -->
    <main id="dashboardGrid" class="bento-grid"></main>
  </div>

  <!-- H4: Detay Penceresi (Popover - Yalnızca Sabit Metrik Detayı) -->
  <div id="detailPopoverBackdrop" class="uiv2-popover-backdrop" aria-hidden="true">
    <div class="uiv2-popover-card" role="dialog" aria-modal="true">
      <button id="btnClosePopover" class="popover-close" type="button" title="Kapat">×</button>
      <div id="popoverMiniChart" class="popover-mini-chart"></div>
      <div id="popoverHint" class="popover-hint">Donanım Telemetri Analizi</div>
      <div id="popoverTitle" class="popover-title">CPU Package — 45.0 °C</div>
      <div id="popoverConfigBox" class="popover-config-box" style="display: none;"></div>
      <div id="popoverList" class="popover-list"></div>
      <div class="popover-actions" style="justify-content: flex-end;">
        <button id="popoverBtnClose2" class="popover-btn-primary" type="button">Tamam</button>
      </div>
    </div>
  </div>

  <!-- Sabit Kart Yönetimi Çekmecesi (Drawer) -->
  <div id="configDrawerBackdrop" class="uiv2-drawer-backdrop" aria-hidden="true">
    <aside class="uiv2-drawer">
      <div class="drawer-header">
        <div>
          <h2 style="font-size: 16px; font-weight: 600;">Sabit Kart Yönetimi</h2>
          <p style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">Görmek istediğiniz sabit özet panellerini açıp kapatabilirsiniz</p>
        </div>
        <button id="btnCloseDrawer" class="icon-btn-ghost" type="button" style="font-size: 18px;">×</button>
      </div>

      <div style="padding: 10px 20px 0; display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span style="font-size: 12.5px; font-weight: 600; color: var(--text-secondary);" id="btnDrawerActiveTab">Sabit Paneller</span>
        <button id="btnResetDefaults" class="ctrl-btn" type="button" style="font-size:11px;padding:5px 8px;">Varsayılana Sıfırla</button>
      </div>

      <div class="drawer-body">
        <div id="drawerContentList" style="display: flex; flex-direction: column; gap: 10px;"></div>
      </div>
    </aside>
  </div>

  <script type="module" src="/v2/js/app.js"></script>
</body>
</html>
